version: "3.9"

services:
  # ── Infrastructure ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"   # Management UI (intentionally exposed)
    networks:
      - backend
      - messaging
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 5

  # ── API Gateway ─────────────────────────────────────────────
  gateway:
    build: ./gateway
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./shared:/app/shared:ro
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      project-service:
        condition: service_healthy
      billing-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      reporting-service:
        condition: service_healthy
    networks:
      - frontend
      - backend

  # ── Auth Service ────────────────────────────────────────────
  auth-service:
    build: ./auth-service
    ports:
      - "8001:8001"
    env_file: .env
    environment:
      DATABASE_URL: ${AUTH_DB_URL}
      SERVICE_NAME: auth-service
      SERVICE_PORT: "8001"
    volumes:
      - ./shared:/app/shared:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── User Service ────────────────────────────────────────────
  user-service:
    build: ./user-service
    ports:
      - "8002:8002"
    env_file: .env
    environment:
      DATABASE_URL: ${USER_DB_URL}
      SERVICE_NAME: user-service
      SERVICE_PORT: "8002"
    volumes:
      - ./shared:/app/shared:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Project Service ─────────────────────────────────────────
  project-service:
    build: ./project-service
    ports:
      - "8003:8003"
    env_file: .env
    environment:
      DATABASE_URL: ${PROJECT_DB_URL}
      SERVICE_NAME: project-service
      SERVICE_PORT: "8003"
    volumes:
      - ./shared:/app/shared:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Billing Service ─────────────────────────────────────────
  billing-service:
    build: ./billing-service
    ports:
      - "8004:8004"
    env_file: .env
    environment:
      DATABASE_URL: ${BILLING_DB_URL}
      SERVICE_NAME: billing-service
      SERVICE_PORT: "8004"
    volumes:
      - ./shared:/app/shared:ro
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend
      - messaging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Payment Service ─────────────────────────────────────────
  payment-service:
    build: ./payment-service
    ports:
      - "8005:8005"
    env_file: .env
    environment:
      DATABASE_URL: ${PAYMENT_DB_URL}
      SERVICE_NAME: payment-service
      SERVICE_PORT: "8005"
    volumes:
      - ./shared:/app/shared:ro
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend
      - messaging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Notification Service ────────────────────────────────────
  notification-service:
    build: ./notification-service
    ports:
      - "8006:8006"
    env_file: .env
    environment:
      DATABASE_URL: ${NOTIFICATION_DB_URL}
      SERVICE_NAME: notification-service
      SERVICE_PORT: "8006"
    volumes:
      - ./shared:/app/shared:ro
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend
      - messaging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Reporting Service ───────────────────────────────────────
  reporting-service:
    build: ./reporting-service
    ports:
      - "8007:8007"
    env_file: .env
    environment:
      DATABASE_URL: ${REPORTING_DB_URL}
      SERVICE_NAME: reporting-service
      SERVICE_PORT: "8007"
    volumes:
      - ./shared:/app/shared:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8007/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  frontend:
  backend:
  messaging:
