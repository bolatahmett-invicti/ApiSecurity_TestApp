apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-auth-code
  namespace: {{ .Release.Namespace }}
data:
  main.py: |
    """Auth Service — JWT authentication and user registration."""

    import sys
    sys.path.insert(0, "/app")

    import uvicorn
    from fastapi import FastAPI

    from database import create_tables
    from routes import router

    app = FastAPI(
        title="Auth Service",
        description="Authentication and JWT token management. Part of the Distributed Vulnerable Platform.",
        version="1.0.0",
        debug=True,  # VULN: Debug mode exposes stack traces
    )

    app.include_router(router)


    @app.on_event("startup")
    def on_startup():
        create_tables()


    @app.get("/health")
    def health():
        return {"status": "ok", "service": "auth-service"}


    if __name__ == "__main__":
        uvicorn.run(app, host="0.0.0.0", port=8001)

  database.py: |
    """Auth service database setup."""

    import os
    import sys

    sys.path.insert(0, "/app")

    from shared.database import Base, get_engine, get_session_factory

    DATABASE_URL = os.getenv("DATABASE_URL", "sqlite:///./auth.db")

    engine = get_engine(DATABASE_URL)
    SessionLocal = get_session_factory(engine)


    def get_db():
        db = SessionLocal()
        try:
            yield db
        finally:
            db.close()


    def create_tables():
        from models import AuthUser, RefreshToken  # noqa: F401
        Base.metadata.create_all(bind=engine)

  models.py: |
    """Auth service SQLAlchemy models."""

    import sys
    sys.path.insert(0, "/app")

    from datetime import datetime, timezone

    from sqlalchemy import Boolean, Column, DateTime, Integer, String
    from shared.database import Base


    class AuthUser(Base):
        __tablename__ = "auth_users"

        id = Column(Integer, primary_key=True, autoincrement=True)
        email = Column(String(255), unique=True, nullable=False, index=True)
        password_hash = Column(String(255), nullable=False)
        role = Column(String(50), default="user")  # admin, user, viewer
        is_active = Column(Boolean, default=True)
        created_at = Column(DateTime, default=lambda: datetime.now(timezone.utc))


    class RefreshToken(Base):
        __tablename__ = "refresh_tokens"

        id = Column(Integer, primary_key=True, autoincrement=True)
        user_id = Column(Integer, nullable=False, index=True)
        token = Column(String(500), nullable=False, unique=True)
        expires_at = Column(DateTime, nullable=False)
        revoked = Column(Boolean, default=False)
        created_at = Column(DateTime, default=lambda: datetime.now(timezone.utc))

  routes.py: |
    """Auth service routes.

    INTENTIONAL VULNERABILITIES:
    - Verbose error messages distinguish 'user not found' vs 'wrong password'
    - Password reset without email verification
    - No brute-force protection
    - Role settable during registration (mass assignment)
    """

    import sys
    sys.path.insert(0, "/app")

    from datetime import datetime, timedelta, timezone

    from fastapi import APIRouter, Depends, HTTPException, status
    from passlib.context import CryptContext
    from sqlalchemy.orm import Session

    from database import get_db
    from models import AuthUser, RefreshToken
    from schemas import (
        LoginRequest,
        RefreshRequest,
        RegisterRequest,
        ResetPasswordRequest,
        TokenResponse,
        UserResponse,
    )
    from shared.auth import create_access_token, create_refresh_token, decode_token, get_current_user

    router = APIRouter(prefix="/auth", tags=["auth"])
    pwd_context = CryptContext(schemes=["bcrypt"], deprecated="auto")

    # Simple user→org mapping (in a real system this would be a DB lookup)
    USER_ORG_MAP = {1: 1, 2: 1, 3: 1, 4: 2, 5: 2, 6: 1}


    def _get_org_id(user_id: int) -> int:
        return USER_ORG_MAP.get(user_id, 1)


    @router.post("/register", response_model=TokenResponse)
    def register(req: RegisterRequest, db: Session = Depends(get_db)):
        """Register a new user.

        VULN: Role is accepted from request body (mass assignment).
        """
        existing = db.query(AuthUser).filter(AuthUser.email == req.email).first()
        if existing:
            raise HTTPException(status_code=400, detail="Email already registered")

        user = AuthUser(
            email=req.email,
            password_hash=pwd_context.hash(req.password),
            role=req.role or "user",  # VULN: accepts role from client
        )
        db.add(user)
        db.commit()
        db.refresh(user)

        token_data = {"user_id": user.id, "email": user.email, "role": user.role, "org_id": _get_org_id(user.id)}
        access = create_access_token(token_data)
        refresh = create_refresh_token(token_data)

        # Store refresh token
        db.add(RefreshToken(
            user_id=user.id,
            token=refresh,
            expires_at=datetime.now(timezone.utc) + timedelta(days=30),
        ))
        db.commit()

        return TokenResponse(access_token=access, refresh_token=refresh)


    @router.post("/login", response_model=TokenResponse)
    def login(req: LoginRequest, db: Session = Depends(get_db)):
        """Login and get JWT tokens.

        VULN: Verbose error messages — distinguishes 'user not found' vs 'wrong password'.
        VULN: No brute-force protection / rate limiting.
        """
        user = db.query(AuthUser).filter(AuthUser.email == req.email).first()
        if not user:
            # VULN: Reveals that the user does not exist
            raise HTTPException(status_code=401, detail="User not found")

        if not pwd_context.verify(req.password, user.password_hash):
            # VULN: Reveals that password is wrong (user exists)
            raise HTTPException(status_code=401, detail="Incorrect password")

        if not user.is_active:
            raise HTTPException(status_code=403, detail="Account deactivated")

        token_data = {"user_id": user.id, "email": user.email, "role": user.role, "org_id": _get_org_id(user.id)}
        access = create_access_token(token_data)
        refresh = create_refresh_token(token_data)

        db.add(RefreshToken(
            user_id=user.id,
            token=refresh,
            expires_at=datetime.now(timezone.utc) + timedelta(days=30),
        ))
        db.commit()

        return TokenResponse(access_token=access, refresh_token=refresh)


    @router.post("/refresh", response_model=TokenResponse)
    def refresh_token(req: RefreshRequest, db: Session = Depends(get_db)):
        """Refresh access token."""
        try:
            payload = decode_token(req.refresh_token)
        except Exception:
            raise HTTPException(status_code=401, detail="Invalid refresh token")

        if payload.get("type") != "refresh":
            raise HTTPException(status_code=401, detail="Not a refresh token")

        stored = db.query(RefreshToken).filter(
            RefreshToken.token == req.refresh_token,
            RefreshToken.revoked == False,
        ).first()

        if not stored:
            raise HTTPException(status_code=401, detail="Token revoked or not found")

        user = db.query(AuthUser).filter(AuthUser.id == payload["user_id"]).first()
        if not user:
            raise HTTPException(status_code=401, detail="User not found")

        token_data = {"user_id": user.id, "email": user.email, "role": user.role, "org_id": _get_org_id(user.id)}
        new_access = create_access_token(token_data)
        new_refresh = create_refresh_token(token_data)

        # Revoke old, issue new
        stored.revoked = True
        db.add(RefreshToken(
            user_id=user.id,
            token=new_refresh,
            expires_at=datetime.now(timezone.utc) + timedelta(days=30),
        ))
        db.commit()

        return TokenResponse(access_token=new_access, refresh_token=new_refresh)


    @router.get("/me", response_model=UserResponse)
    def get_me(current_user: dict = Depends(get_current_user), db: Session = Depends(get_db)):
        """Get current authenticated user."""
        user = db.query(AuthUser).filter(AuthUser.id == current_user["user_id"]).first()
        if not user:
            raise HTTPException(status_code=404, detail="User not found")
        return UserResponse(id=user.id, email=user.email, role=user.role, is_active=user.is_active)


    @router.post("/reset-password")
    def reset_password(req: ResetPasswordRequest, db: Session = Depends(get_db)):
        """Reset password.

        VULN: No email verification — anyone can reset any user's password
        if they know the email address.
        """
        user = db.query(AuthUser).filter(AuthUser.email == req.email).first()
        if not user:
            raise HTTPException(status_code=404, detail="User not found")

        user.password_hash = pwd_context.hash(req.new_password)
        db.commit()
        return {"message": "Password reset successful"}

  schemas.py: |
    """Auth service Pydantic schemas."""

    from pydantic import BaseModel, EmailStr
    from typing import Optional


    class RegisterRequest(BaseModel):
        email: EmailStr
        password: str
        role: Optional[str] = "user"


    class LoginRequest(BaseModel):
        email: EmailStr
        password: str


    class TokenResponse(BaseModel):
        access_token: str
        refresh_token: str
        token_type: str = "bearer"


    class RefreshRequest(BaseModel):
        refresh_token: str


    class ResetPasswordRequest(BaseModel):
        email: EmailStr
        new_password: str


    class UserResponse(BaseModel):
        id: int
        email: str
        role: str
        is_active: bool
