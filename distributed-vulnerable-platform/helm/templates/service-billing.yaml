---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-billing
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.billingService.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-billing
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-billing
    spec:
      initContainers:
      - name: install-deps
        image: python:3.12-slim
        command: ["sh", "-c", "pip install --target=/deps --quiet fastapi==0.115.0 uvicorn==0.30.6 sqlalchemy==2.0.35 psycopg2-binary==2.9.9 'pydantic==2.9.2' 'pydantic[email]' PyJWT==2.9.0 'passlib[bcrypt]==1.7.4' 'bcrypt<4.1' pika==1.3.2 httpx==0.27.0"]
        volumeMounts:
        - name: deps
          mountPath: /deps
      containers:
      - name: billing
        image: python:3.12-slim
        command: ["python", "/app/main.py"]
        env:
        - name: PYTHONPATH
          value: "/deps:/app"
        - name: DATABASE_URL
          value: "postgresql://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@{{ .Release.Name }}-postgres:5432/billing_db"
        - name: SERVICE_NAME
          value: billing-service
        - name: SERVICE_PORT
          value: "8004"
        - name: JWT_SECRET
          value: {{ .Values.jwt.secret | quote }}
        - name: JWT_ALGORITHM
          value: {{ .Values.jwt.algorithm | quote }}
        - name: JWT_EXPIRY_MINUTES
          value: {{ .Values.jwt.expiryMinutes | quote }}
        - name: RABBITMQ_HOST
          value: {{ .Release.Name }}-rabbitmq
        - name: RABBITMQ_PORT
          value: "5672"
        - name: RABBITMQ_USER
          value: {{ .Values.rabbitmq.user | quote }}
        - name: RABBITMQ_PASSWORD
          value: {{ .Values.rabbitmq.password | quote }}
        ports:
        - containerPort: 8004
        volumeMounts:
        - name: deps
          mountPath: /deps
          readOnly: true
        - name: shared-code
          mountPath: /app/shared
          readOnly: true
        - name: service-code
          mountPath: /app
          readOnly: true
        readinessProbe:
          httpGet:
            path: /health
            port: 8004
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: deps
        emptyDir: {}
      - name: shared-code
        configMap:
          name: {{ .Release.Name }}-shared-code
      - name: service-code
        configMap:
          name: {{ .Release.Name }}-billing-code
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-billing
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: {{ .Release.Name }}-billing
  ports:
  - port: 8004
    targetPort: 8004
